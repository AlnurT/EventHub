services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eventhub_user
      POSTGRES_PASSWORD: eventhub_pass
      POSTGRES_DB: eventhub_db
    ports:
      - "5432:5432"
    volumes:
      - eventhub_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventhub_user -d eventhub_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  eventhub_pg_data: