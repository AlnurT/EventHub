[project]
name = "eventhub"
version = "0.1.0"
description = "Event ticketing & seat reservation API"
requires-python = ">=3.12"

dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",           # async-драйвер для подключения к PostgreSQL
    "alembic>=1.14",           # миграции схемы БД
    "pydantic-settings>=2.6",  # чтение переменных окружения из .env
    "uuid6>=2025.0.1",
    "mypy>=2.3.1",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",     # тесты для async-кода
    "testcontainers[postgres]>=4.9",  # реальный Postgres в Docker на время тестов
]

# ---------- Ruff: линтер + форматтер в одном инструменте ----------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E,F - базовые ошибки/pyflakes; I - сортировка импортов (замена isort);
# UP - подсказки на современный синтаксис Python; B - bugbear (частые баги)
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # длину строк уже контролирует line-length + форматтер

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---------- Mypy: статическая типизация ----------
[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["tests/"]
plugins = ["pydantic.mypy"]

# ---------- Pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
